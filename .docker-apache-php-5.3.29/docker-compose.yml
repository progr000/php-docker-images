#version: '3.3'

services:
  ################################################
  crm-test-apache:
    build:
      context: config/
      dockerfile: Dockerfile
    container_name: crm-test-php53
    restart: unless-stopped
    ports:
      - ${APACHE_INTERNAL_HTTP_PORT}:80
      - ${APACHE_INTERNAL_HTTPS_PORT}:443
    volumes:
      - ./../app:/var/www
      #- ./config/bin/apache2-foreground:/usr/local/bin/apache2-foreground:rw
