version: '3.3'

services:
  ################################################
  crm-test-apache:
    build:
      context: config/
      dockerfile: Dockerfile
      args:
        - APP_ENVIRONMENT=${APP_ENVIRONMENT}
    container_name: crm-test-apache
    restart: unless-stopped
    ports:
      - ${APACHE_INTERNAL_HTTP_PORT}:80
      - ${APACHE_INTERNAL_HTTPS_PORT}:443
    volumes:
      - ./../app:/var/www
