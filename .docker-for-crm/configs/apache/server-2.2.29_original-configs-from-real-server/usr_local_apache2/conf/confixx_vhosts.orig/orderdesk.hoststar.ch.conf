
<Directory "/home/www/web1/html">
  Options -FollowSymLinks -SymLinksIfOwnerMatch
  php_admin_flag engine on
  <IfModule mod_access.c>
    Allow from all
  </IfModule>
</Directory>

NameVirtualHost 85.10.203.14:80

<VirtualHost 85.10.203.14:80>
  ServerName orderdesk.hoststar.ch
  ServerAlias www.orderdesk.hoststar.ch web1.order.hoststar.ch www.delete.hoststar.ch  \
  www.shop.hoststar.ch www.payback.hoststar.ch my.hoststarcenter.ch www.my.hoststarcenter.ch 
  DocumentRoot /home/www/web1/html
  ScriptAlias /cgi-bin/ /home/www/web1/html/cgi-bin/
  php_admin_value open_basedir /home/www/web1/html/:/home/www/web1/phptmp/:/home/www/web1/files/:/home/www/web1/atd/
  php_admin_value file_uploads 1
  php_admin_value upload_tmp_dir /home/www/web1/phptmp/

  <Directory /home/www/web1/html/admin>
    Order allow, deny
    Allow from 84.253.15.193 62.204.111.146 80.219.13.98 84.74.145.186 85.10.199.215 85.4.170.63 92.107.30.22 127.0.0.1
  </Directory>

  php_admin_flag register_globals on
  php_admin_flag magic_quotes_gpc on
  php_admin_flag safe_mode off
  php_admin_value safe_mode_exec_dir /home/www/empty/
  php_admin_flag allow_call_time_pass_reference on
  php_admin_value memory_limit 64M
  php_admin_value upload_max_filesize 8M
  php_admin_value open_basedir /home/www/web1/:/usr/bin:/usr/local/saferpay:/home/www/empty:/tmp
  php_admin_value session.save_path /home/www/web1/phptmp
  php_admin_value max_execution_time 300
</VirtualHost>

NameVirtualHost 85.10.203.14:443

<VirtualHost 85.10.203.14:443>
  ServerName web1.order.hoststar.ch
  DocumentRoot /home/www/web1/html
  ScriptAlias /cgi-bin/ /home/www/web1/html/cgi-bin/
  php_admin_value open_basedir /home/www/web1/html/:/home/www/web1/phptmp/:/home/www/web1/files/:/home/www/web1/atd/
  php_admin_value file_uploads 1
  php_admin_value upload_tmp_dir /home/www/web1/phptmp/
  <IfModule mod_ssl.c>
    SSLEngine on
    SSLCertificateKeyFile /etc/apache2/ssl.key/admin.key
    SSLCertificateFile /etc/apache2/ssl.crt/admin.crt
    SetEnvIf User-Agent ".*MSIE.*" \
      nokeepalive ssl-unclean-shutdown \
      downgrade-1.0 force-response-1.0
      SSLCertificateChainFile /etc/apache2/ssl.crt/ca-admin.crt
    <Files ~ "\.(cgi|shtml|phtml|php3?)$">
      SSLOptions +StdEnvVars
    </Files>
    <Directory "/home/www/web1/html/cgi-bin">
      SSLOptions +StdEnvVars
    </Directory>
  </IfModule>

  php_admin_flag register_globals on
  php_admin_flag magic_quotes_gpc on
  php_admin_flag safe_mode off
  php_admin_value safe_mode_exec_dir /home/www/empty/
  php_admin_flag allow_call_time_pass_reference on
  php_admin_value memory_limit 64M
  php_admin_value upload_max_filesize 8M
  php_admin_value open_basedir /home/www/web1/:/usr/bin:/usr/local/saferpay:/home/www/empty:/tmp
  php_admin_value session.save_path /home/www/web1/phptmp
