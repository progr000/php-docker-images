#
# Files in this directory are created at apache start time by /usr/sbin/rcapache2 
# Do not edit them!
#

# see /etc/sysconfig/apache2

ServerSignature on
UseCanonicalName off
ServerTokens OS
TypesConfig mime/mime.types
AddDefaultCharset UTF-8

#HostnameLookups Off
#ServerName localhost

ServerName tuxapps
ServerAdmin servermaster@hoststar.ch
DirectoryIndex index.html index.html.var

<Directory />
    Options None
    AllowOverride None
    Order deny,allow
    Deny from all
</Directory>

AccessFileName .htaccess
# and never show them
<Files ~ "^\.ht">
    Order allow,deny
    Deny from all
</Files>

Alias /icons/ "/usr/share/apache2/icons/"

<Directory "/usr/share/apache2/icons">
    Options Indexes MultiViews
    AllowOverride None
    Order allow,deny
    Allow from all
</Directory>

ScriptAlias /cgi-bin/ "/srv/www/cgi-bin/"

<Directory "/srv/www/cgi-bin">
    AllowOverride None
    Options +ExecCGI -Includes
    Order allow,deny
    Allow from all
</Directory>

<IfModule mod_userdir.c>
    UserDir public_html
    Include mods/mod_userdir.conf
</IfModule>
