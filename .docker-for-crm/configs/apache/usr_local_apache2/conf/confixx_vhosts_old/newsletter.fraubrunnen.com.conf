
<Directory "/home/www/web4/html">
  Options -FollowSymLinks -SymLinksIfOwnerMatch
  AllowOverride All
  php_admin_flag engine on
    Allow from all
</Directory>

<VirtualHost 85.10.203.27:80>
  ServerName newsletter.fraubrunnen.com
  ServerAlias www.newsletter.fraubrunnen.com web4.order.hoststar.ch news.fraubrunnen.com  \
  www.news.fraubrunnen.com 
  DocumentRoot /home/www/web4/html
  ScriptAlias /cgi-bin/ /home/www/web4/html/cgi-bin/
#  php_admin_value open_basedir /home/www/web4/html/:/home/www/web4/phptmp/:/home/www/web4/files/:/home/www/web4/atd/
  php_admin_value file_uploads 1
  php_admin_value upload_tmp_dir /home/www/web4/phptmp/

  php_admin_flag register_globals off
  php_admin_flag safe_mode off
  php_admin_flag magic_quotes_gpc on
  php_admin_flag allow_call_time_pass_reference on
#  php_admin_value open_basedir /home/www/web4/:/usr/bin
  php_admin_value session.save_path /home/www/web4/phptmp
</VirtualHost>

