#Detect possible evasion attempt
SecRule MULTIPART_UNMATCHED_BOUNDARY "!@eq 0" \
        "phase:2,t:none,deny,status:403,msg:'Multipart parser detected a possible unmatched boundary. This may be an impedence mismatch attack, a broken application or a broken connection.  This is not a false positive.  Check your application or client for errors.',id:'330792',severity:2"

#Enforce strict multipart body checks
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
        "phase:2,t:none,deny,status:403,,msg:'Multipart request body failed strict validation: \
PE %{REQBODY_PROCESSOR_ERROR}, \
BQ %{MULTIPART_BOUNDARY_QUOTED}, \
BW %{MULTIPART_BOUNDARY_WHITESPACE}, \
DB %{MULTIPART_DATA_BEFORE}, \
DA %{MULTIPART_DATA_AFTER}, \
HF %{MULTIPART_HEADER_FOLDING}, \
LF %{MULTIPART_LF_LINE}, \
SM %{MULTIPART_SEMICOLON_MISSING}, \
IQ %{MULTIPART_INVALID_QUOTING}, \
IH %{MULTIPART_INVALID_HEADER_FOLDING}, \
IQ %{MULTIPART_INVALID_PART}, \
IH %{MULTIPART_FILE_LIMIT_EXCEEDED}',id:'330793',rev:2,severity:2"

SecRule REQUEST_URI "\%((?!$|\W)|[0-9a-fA-F]{2}|u[0-9a-fA-F]{4})" \
        "chain,phase:2,t:none,log,auditlog,status:400,msg:'Atomicorp.com UNSUPPORTED DELAYED Rules: Possible URL Encoding Abuse Attack Attempt',id:'390703',rev:5,severity:'5'"
SecRule REQUEST_URI "@validateUrlEncoding"

SecRule REQUEST_HEADERS:Content-Type "^(application\/x-www-form-urlencoded|text\/xml)(?:;(?:\s?charset\s?=\s?[\w\d\-]{1,18})?)??$" \
        "chain,phase:2,t:none,log,auditlog,status:400,msg:'Atomicorp.com UNSUPPORTED DELAYED Rules: Possible Encoding Abuse Attack Attempt',id:'390704',rev:1,severity:'5'"
SecRule REQUEST_BODY|XML:/* "\%((?!$|\W)|[0-9a-fA-F]{2}|u[0-9a-fA-F]{4})" "chain"
SecRule REQUEST_BODY|XML:/* "@validateUrlEncoding"

#Check for suspiscious indicators, such as missing Host: headers, empty headers, numeric, etc.
SecRule &REQUEST_HEADERS:Host "@eq 0" \
                "chain,skipAfter:END_HOST_CHECK,phase:2,rev:2,t:none,pass,msg:'Atomicorp.com UNSUPPORTED DELAYED Rules: Suspicious activity detected - HTTP Request Missing a Host Header',id:'331030',severity:'5'"
SecRule REMOTE_ADDR "!@ipMatch 127.0.0.1,::1"  "t:none"

SecRule REQUEST_HEADERS:Host "^$" \
      "phase:2,rev:1,t:none,pass,msg:'Atomicorp.com UNSUPPORTED DELAYED Rules: Suspicious activity detected - Empty Host Header detected in HTTP request',id:'331031',severity:'5'"

#disabled because of nagios //tch 08.04.15
#SecRule REQUEST_HEADERS:Host "^[\d.:]+$" \
#"chain,phase:2,rev:2,t:none,pass,msg:'Atomicorp.com UNSUPPORTED DELAYED Rules: Suspicious activity detected - Host header is a numeric IP address', severity:'2',id:'331032',severity:'5'"
#SecRule REMOTE_ADDR "!@ipMatch 127.0.0.1,::1"  "t:none"

SecMarker END_HOST_CHECK

