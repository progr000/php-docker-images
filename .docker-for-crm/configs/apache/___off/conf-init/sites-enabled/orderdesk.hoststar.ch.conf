<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName o.localhost

    DocumentRoot /home/www/web1/html

    ErrorLog /var/log/apache2/error-orderdesk.log
    CustomLog /var/log/apache2/access-orderdesk.log combined

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
            SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory /usr/lib/cgi-bin>
            SSLOptions +StdEnvVars
    </Directory>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName o.localhost

    DocumentRoot /home/www/web1/html

    ErrorLog /var/log/apache2/error-orderdesk.log
    CustomLog /var/log/apache2/access-orderdesk.log combined

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/wdm.localhost.crt
    SSLCertificateKeyFile /etc/apache2/certs/wdm.localhost.key

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
            SSLOptions +StdEnvVars
    </FilesMatch>
    <Directory /usr/lib/cgi-bin>
            SSLOptions +StdEnvVars
    </Directory>

    php_admin_flag register_globals on
    php_admin_flag magic_quotes_gpc on
    php_admin_flag safe_mode off
    php_admin_value safe_mode_exec_dir /home/www/empty/
    php_admin_flag allow_call_time_pass_reference on
    #php_admin_value open_basedir /home/www/web1/:/usr/bin:/usr/local/saferpay:/home/www/empty:/tmp
    php_admin_value session.save_path /home/www/web1/phptmp
    php_admin_value max_execution_time 1200

</VirtualHost>
</IfModule>