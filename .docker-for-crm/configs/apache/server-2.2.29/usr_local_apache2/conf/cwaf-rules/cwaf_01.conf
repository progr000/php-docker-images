SecComponentSignature "COMODO WAF: rules for Apache 2.4"
SecResponseBodyAccess Off

SecDefaultAction \
	"phase:1,\
	deny,\
	log"
SecDefaultAction \
	"phase:2,\
	deny,\
	log"

SecAction \
	"id:210000,\
	phase:1,\
	pass,\
	setvar:tx.points_limit4=5, setvar:tx.points_limit3=4, setvar:tx.points_limit2=3, setvar:tx.points_limit1=2,\
	nolog,\
	t:none"


SecAction \
	"id:210010,\
	phase:1,\
	pass,\
	setvar:tx.points=0, setvar:tx.sqli_points=0, setvar:tx.xss_points=0, setvar:tx.incoming_points=0, setvar:tx.outgoing_points=0,\
	nolog,\
	t:none"


SecAction \
	"id:210020,\
	phase:1,\
	pass,\
	setvar:tx.incoming_points_limit=5, setvar:tx.outgoing_points_limit=4,\
	nolog,\
	t:none"


SecAction \
	"id:'210025', \
	phase:1, \
	pass, \
	setvar:tx.points_blocking=off, setvar:tx.process_response=off, \
	nolog, \
	t:none"

SecAction \
	"id:210030,\
	phase:1,\
	pass,\
	setvar:tx.max_num_args=1000,\
	nolog,\
	t:none"

SecAction \
	"id:210040,\
	phase:1,\
	pass,\
	setvar:'tx.allowed_methods=GET HEAD POST OPTIONS', setvar:'tx.allowed_request_content_type=application/x-www-form-urlencoded|multipart/form-data|text/xml|application/xml|application/x-amf|application/json', setvar:'tx.allowed_http_versions=HTTP/0.9 HTTP/1.0 HTTP/1.1', setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .resources/ .resx/ .sql/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/', setvar:'tx.restricted_headers=/Proxy-Connection/ /Lock-Token/ /Content-Range/ /Translate/ /via/ /if/',\
	nolog,\
	t:none"

SecRule REQUEST_HEADERS:Content-Type "text/xml" \
	"chain,\
	id:210050,\
	phase:1,\
	pass,\
	nolog,\
	t:none, t:lowercase"
SecRule REQBODY_PROCESSOR "!@streq XML" \
	"ctl:requestBodyProcessor=XML"


SecRule REQUEST_HEADERS:User-Agent "^(.{0,})$" \
	"id:210060,\
	phase:1,\
	pass,\
	setvar:tx.ua_hash=%{matched_var},\
	nolog,\
	t:none, t:sha1, t:hexEncode"


SecRule REQUEST_HEADERS:x-forwarded-for "^\b([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\b" \
	"id:210070,\
	phase:1,\
	capture,\
	pass,\
	setvar:tx.real_ip=%{tx.1},\
	nolog,\
	t:none"


SecRule &TX:REAL_IP "!@eq 0" \
	"id:210080,\
	phase:1,\
	pass,\
	initcol:global=global, initcol:ip=%{tx.real_ip}_%{tx.ua_hash},\
	nolog,\
	t:none"


SecRule &TX:REAL_IP "@eq 0" \
	"id:210090,\
	phase:1,\
	pass,\
	initcol:global=global, initcol:ip=%{remote_addr}_%{tx.ua_hash},\
	setvar:tx.real_ip=%{remote_addr},\
	nolog,\
	t:none"

SecRule WEBSERVER_ERROR_LOG "@contains Invalid URI in request" \
	"id:210210,\
	msg:'COMODO WAF: Apache Error: Invalid URI in Request.',\
	phase:5,\
	severity:4,\
	pass,\
	setvar:tx.points=+%{tx.points_limit1},\
	logdata:'%{request_line}',\
	t:none"

SecRule FILES|FILES_NAMES "[\"';=]" \
	"id:210220,\
	msg:'COMODO WAF: Attempted multipart/form-data bypass',\
	phase:2,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit4},\
	logdata:'%{matched_var}',\
	t:none, t:urlDecodeUni"

SecRule REQBODY_ERROR "!@eq 0" \
	"id:210230,\
	msg:'COMODO WAF: The request body could not be parsed. Possibility of an impedance mismatch attack. This is not a false positive.',\
	phase:2,\
	severity:2,\
	pass,\
	setvar:tx.points=+%{tx.points_limit4},\
	logdata:'%{REQBODY_ERROR_MSG}',\
	t:none"

SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
	"id:210240,\
	msg:'COMODO WAF: Multipart request body failed strict validation: PE %{REQBODY_PROCESSOR_ERROR}',\
	phase:2,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit4},\
	t:none"

SecRule REQUEST_HEADERS:Content-Length "!^[0-9]{1,}$" \
	"id:210260,\
	msg:'COMODO WAF: Content-Length HTTP header is not numeric.',\
	phase:1,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit4},\
	logdata:'%{matched_var}',\
	t:none"


SecRule REQUEST_METHOD "^(?:GET|HEAD)$" \
	"chain,\
	id:210270,\
	msg:'COMODO WAF: GET or HEAD Request with Body Content.',\
	phase:1,\
	severity:2,\
	block,\
	logdata:'%{matched_var}',\
	t:none"
SecRule REQUEST_HEADERS:Content-Length "!^0{0,1}$" \
	"setvar:tx.points=+%{tx.points_limit4},\
	t:none"


SecRule REQUEST_METHOD "^POST$" \
	"chain,\
	id:210280,\
	msg:'COMODO WAF: POST request missing Content-Length Header.',\
	phase:1,\
	severity:4,\
	block,\
	logdata:'%{matched_var}',\
	t:none"
SecRule &REQUEST_HEADERS:Content-Length "@eq 0" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none"


SecRule REQUEST_HEADERS:Content-Encoding "^Identity$" \
	"id:210290,\
	msg:'COMODO WAF: Invalid Use of Identity Encoding.',\
	phase:1,\
	severity:4,\
	block,\
	setvar:tx.points=+%{tx.points_limit1},\
	logdata:'%{matched_var}',\
	t:none"


SecRule REQUEST_HEADERS:Expect "@contains 100-continue" \
	"chain,\
	id:210300,\
	msg:'COMODO WAF: Expect Header Not Allowed for HTTP 1.0.',\
	phase:1,\
	severity:5,\
	block,\
	logdata:'%{matched_var}',\
	t:none"
SecRule REQUEST_PROTOCOL "@streq HTTP/1.0" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none"

SecRule REQUEST_HEADERS:Range|REQUEST_HEADERS:Request-Range "([0-9]{1,})-([0-9]{1,})," \
	"chain,\
	id:210330,\
	msg:'COMODO WAF: Range: Invalid Last Byte Value.',\
	phase:2,\
	severity:4,\
	capture,\
	block,\
	setvar:tx.points=+%{tx.points_limit2},\
	logdata:'%{matched_var}',\
	t:none"
SecRule TX:2 "!@ge %{tx.1}"

SecRule REQUEST_HEADERS:Range|REQUEST_HEADERS:Request-Range "^bytes=([0-9]{1,}){0,1}-([0-9]{1,}){0,1},[\t\n\r ]{0,1}([0-9]{1,}){0,1}-([0-9]{1,}){0,1},[\t\n\r ]{0,1}([0-9]{1,}){0,1}-([0-9]{1,}){0,1},[\t\n\r ]{0,1}([0-9]{1,}){0,1}-([0-9]{1,}){0,1},[\t\n\r ]{0,1}([0-9]{1,}){0,1}-([0-9]{1,}){0,1}," \
	"id:210340,\
	msg:'COMODO WAF: Range: Too many fields',\
	phase:2,\
	severity:4,\
	capture,\
	block,\
	setvar:tx.points=+%{tx.points_limit2},\
	logdata:'%{matched_var}',\
	t:none"


SecRule REQUEST_HEADERS:Connection "\b(close|keep-alive),[\t\n\r ]{0,1}(close|keep-alive)\b" \
	"id:210350,\
	msg:'COMODO WAF: Multiple/Conflicting Connection Header Data Found.',\
	phase:2,\
	severity:4,\
	block,\
	setvar:tx.points=+%{tx.points_limit2},\
	logdata:'%{matched_var}',\
	t:none"

SecRule REQUEST_HEADERS:Content-Type "^(application/x-www-form-urlencoded|text/xml)(?:;(?:[\t\n\r ]{0,1}charset[\t\n\r ]{0,1}=[\t\n\r ]{0,1}[a-zA-Z0-9\-_]{1,18}){0,1}){0,1}?$" \
	"chain,\
	id:210380,\
	msg:'COMODO WAF: URL Encoding Abuse Attack Attempt',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule REQUEST_BODY|XML:/* "%(u[0-9ABCDEFabcdef]{4,4}|[0-9ABCDEFabcdef]{2,2}|(?!$|[^a-zA-Z0-9_]))" \
	"chain"
SecRule REQUEST_BODY|XML:/* "@validateUrlEncoding" \
	"setvar:tx.points=+%{tx.points_limit2}"


SecRule TX:CRS_VALIDATE_UTF8_ENCODING "@eq 1" \
	"chain,\
	id:210390,\
	msg:'COMODO WAF: UTF8 Encoding Abuse Attack Attempt',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule ARGS|ARGS_NAMES|REQUEST_FILENAME "@validateUtf8Encoding" \
	"setvar:tx.points=+%{tx.points_limit2}"


SecRule REQUEST_BODY|REQUEST_URI "%u[Ff]{2,2}[0-9ABCDEFabcdef]{2,2}" \
	"id:210400,\
	msg:'COMODO WAF: Unicode Full/Half Width Abuse Attack Attempt',\
	phase:2,\
	severity:4,\
	block,\
	setvar:tx.points=+%{tx.points_limit2},\
	t:none"




SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|!REQUEST_HEADERS:Referer "@validateByteRange 1-255" \
	"id:210410,\
	msg:'COMODO WAF: Invalid character in request',\
	phase:2,\
	severity:3,\
	block,\
	setvar:tx.points=+%{tx.points_limit3},\
	t:none, t:urlDecodeUni"

SecRule TX:PARANOID_MODE "@eq 1" \
	"chain,\
	id:210420,\
	msg:'COMODO WAF: Invalid character in request',\
	phase:2,\
	severity:3,\
	block,\
	t:none, t:urlDecodeUni"
SecRule REQUEST_BODY|REQUEST_HEADERS|REQUEST_HEADERS_NAMES|REQUEST_URI|TX:HPP_DATA|!REQUEST_HEADERS:Referer "@validateByteRange 32-126" \
	"setvar:tx.points=+%{tx.points_limit3},\
	t:urlDecodeUni"

SecRule &TX:ARG_NAME_LENGTH "@eq 1" \
	"chain,\
	id:210600,\
	msg:'COMODO WAF: Argument name too long',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule ARGS_NAMES "@gt %{tx.arg_name_length}" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none, t:length"

SecRule &TX:ARG_LENGTH "@eq 1" \
	"chain,\
	id:210610,\
	msg:'COMODO WAF: Argument value too long',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule ARGS "@gt %{tx.arg_length}" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none, t:length"

SecRule &TX:MAX_NUM_ARGS "@eq 1" \
	"chain,\
	id:210620,\
	msg:'COMODO WAF: Too many arguments in request',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule &ARGS "@gt %{tx.max_num_args}" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none"

SecRule &TX:TOTAL_ARG_LENGTH "@eq 1" \
	"chain,\
	id:210630,\
	msg:'COMODO WAF: Total arguments size exceeded',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule ARGS_COMBINED_SIZE "@gt %{tx.total_arg_length}" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none"



SecRule &TX:MAX_FILE_SIZE "@eq 1" \
	"chain,\
	id:210640,\
	msg:'COMODO WAF: Uploaded file size too large',\
	phase:1,\
	severity:4,\
	block,\
	t:none"
SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
	"chain"
SecRule REQUEST_HEADERS:Content-Length "@gt %{tx.max_file_size}" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none"

SecRule &TX:COMBINED_FILE_SIZES "@eq 1" \
	"chain,\
	id:210650,\
	msg:'COMODO WAF: Total uploaded files size too large',\
	phase:2,\
	severity:4,\
	block,\
	t:none"
SecRule FILES_COMBINED_SIZE "@gt %{tx.combined_file_sizes}" \
	"setvar:tx.points=+%{tx.points_limit1},\
	t:none"





SecRule REQUEST_METHOD "!@within %{tx.allowed_methods}" \
	"id:210700,\
	msg:'COMODO WAF: Method is not allowed by policy',\
	phase:1,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit2},\
	logdata:'%{matched_var}',\
	t:none"


SecRule REQUEST_METHOD "!^(?:GET|POST|HEAD|OPTIONS|PROPFIND)$" \
	"chain,\
	id:210710,\
	msg:'COMODO WAF: Request content type is not allowed by policy',\
	phase:1,\
	severity:2,\
	block,\
	logdata:'%{matched_var}',\
	t:none"
SecRule REQUEST_HEADERS:Content-Type "^([^\t\n\r ;]{1,})" \
	"chain,\
	capture"
SecRule TX:0 "!^%{tx.allowed_request_content_type}$" \
	"setvar:tx.points=+%{tx.points_limit4},\
	ctl:forceRequestBodyVariable=On,\
	t:none"

SecRule REQUEST_PROTOCOL "!@within %{tx.allowed_http_versions}" \
	"id:210720,\
	msg:'COMODO WAF: HTTP protocol version is not allowed by policy',\
	phase:2,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit2},\
	logdata:'%{matched_var}',\
	t:none"

SecRule REQUEST_BASENAME "\.(.{0,})$" \
	"chain,\
	id:210730,\
	msg:'COMODO WAF: URL file extension is restricted by policy',\
	phase:2,\
	severity:2,\
	capture,\
	block,\
	setvar:tx.extension=.%{tx.1}/,\
	logdata:'%{TX.0}',\
	t:none, t:urlDecodeUni, t:lowercase"
SecRule TX:EXTENSION "@within %{tx.restricted_extensions}" \
	"setvar:tx.points=+%{tx.points_limit2},\
	t:none"



SecRule REQUEST_HEADERS_NAMES "^(.{0,})$" \
	"chain,\
	id:210740,\
	msg:'COMODO WAF: HTTP header is restricted by policy',\
	phase:2,\
	severity:4,\
	capture,\
	block,\
	setvar:'tx.header_name=/%{tx.0}/',\
	logdata:'%{matched_var}',\
	t:none"
SecRule TX:HEADER_NAME "@within %{tx.restricted_headers}" \
	"setvar:tx.points=+%{tx.points_limit2}"




SecRule REQUEST_HEADERS:User-Agent "@pmFromFile bl_scanners" \
	"id:210800,\
	msg:'COMODO WAF: Request Indicates a Security Scanner Scanned the Site',\
	phase:2,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit4},\
	logdata:'%{matched_var}',\
	t:none, t:lowercase"
SecRule REQUEST_HEADERS_NAMES "\bacunetix-product\b" \
	"id:210810,\
	msg:'COMODO WAF: Request Indicates a Security Scanner Scanned the Site',\
	phase:2,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit4},\
	logdata:'%{matched_var}',\
	t:none, t:lowercase"
SecRule REQUEST_FILENAME "@pm nessustest appscan_fingerprint" \
	"id:210820,\
	msg:'COMODO WAF: Request Indicates a Security Scanner Scanned the Site',\
	phase:2,\
	severity:2,\
	block,\
	setvar:tx.points=+%{tx.points_limit4},\
	logdata:'%{matched_var}',\
	t:none, t:lowercase"

SecRule REQUEST_HEADERS:User-Agent "@pmFromFile bl_agents" \
	"chain,\
	id:210830,\
	msg:'COMODO WAF: Rogue web site crawler',\
	phase:2,\
	severity:4,\
	capture,\
	block,\
	logdata:'%{TX.0}',\
	t:none"
SecRule REQUEST_HEADERS:User-Agent "(?i:(?:^(?:microsoft url|user-Agent|www\.weblogs\.com|(?:jakart|vi)a|(google|i{0,1}explorer{0,1}\.exe|(ms){0,1}ie( [0-9.]{1,}){0,1} {0,1}(compatible( browser){0,1}){0,1})$)|\bdatacha0s\b|; widows|\\\r|a(?: href=|d(?:sarobot|vanced email extractor)|gdm79@mail\.ru|miga-aweb/3\.4|t(?:hens|tache|(?:omic_email_hunt|spid)er)|utoemailspider)|b(?:ackdoor|lack hole|utch__2\.1\.1|wh3_user_agent)|c(?:h(?:e(?:esebot|rrypicker)|ina(?: local browse 2\.|claw))|o(?:mpatible(?: ;(?: msie|\.)|-)|n(?:cealed defense|t(?:actbot/|entsmartz)|veracrawler)|py(?:guard|rightcheck)|re-project/1.0)|rescent internet toolpak)|d(?:ig(?:imarc webreader|out4uagent)|ts agent)|e(?:ducate search vxb|mail(?:siphon|wolf|(?: extracto|reape)r|(siphon|spider)|(?:collec|harves|magne)t)|o browse|xtractorpro|(?:collecto|irgrabbe)r)|f(?:a(?:xobot|(?:ntombrows|stlwspid)er)|loodgate|oobar/|ull web bot|(?:iddle|ranklin locato)r)|g(?:ameBoy, powered by nintendo|ecko/25|rub(?: crawler|-client))|h(?:anzoweb|hjhj@yahoo|l_ftien_spider)|i(?:n(?:dy library|ternet(?: (?:exploiter sux|ninja)|-exprorer))|sc systems irc search 2\.1)|kenjin spider|larbin@unspecified|m(?:ailto:craftbot@yahoo\.com|i(?:crosoft (?:internet explorer/5\.0$|url control)|ssigua)|o(?:r(?:feus fucking scanner|zilla)|siac 1.|zilla/3\.mozilla/2\.01$)|urzillo compatible)|n(?:ameofagent|e(?:ssus|(?:uralbot/0\.|wt activeX; win3)2)|ikto|o(?: browser|kia-waptoolkit.{0,} googlebot.{0,}googlebot))|p(?:a(?:ckrat|nscient\.com)|cbrowser|e 1\.4|leasecrawl/1\.|mafind|oe-component-client|ro(?:duction bot|gram shareware 1\.0\.|webwalker)|s(?:urf|ycheclone))|rsync|s(?:\.t\.a\.l\.k\.e\.r\.|afexplorer tl|e(?:archbot admin@google.com|curity scan)|hai|itesnagger|(?:tress tes|urveybo)t)|t(?:ele(?:port pro|soft)|oata dragostea mea pentru diavola|uring machine|(?: {0,1}h {0,1}a {0,1}t {0,1}' {0,1}s g {0,1}o {0,1}t {0,1}t {0,1}a {0,1} h {0,1}u {0,1}r {0,1}|akeou|his is an exploi)t)|u(?:nder the rainbow 2\.|ser-agent:)|v(?:adixbot|oideye)|w(?:3mir|e(?:b(?: (?:by mail|downloader)|emailextract{0,1}|mole|vulnscan|(?:bandi|(?:altb|ro)o)t)|lls search ii|p Search 00)|i(?:ndows(?:-update-agent)|se(?:nut){0,1}bot)|ordpress(?: hash grabber|/4\.01))|zeus(?: .{0,}webster pro){0,1}|[a-z]surf[0-9][0-9]|(?:$botname/$botvers|(script|sql) inject)ion|(compatible ; msie|msie .{1,}; .{0,}windows xp)|(?:8484 boston projec|xmlrpc exploi)t|(sogou develop spider|sohu agent)|(?:demo bot|(?:d|e)browse)|(libwen-us|myie2|murzillo compatible|webaltbot|wisenutbot)))" \
	"capture,\
	setvar:tx.points=+%{tx.points_limit2}"
SecMarker SECMARKER_210800

SecDefaultAction \
	"phase:2,\
	deny,\
	status:403,\
	log,\
	auditlog"

SecRule REQUEST_FILENAME "\.(avi|bmp|css|cgm|gif|ico|js|mp(3|4)|og(m|v|x)|p(n(g|m)|(b|g|p)m)|svg|swf|tiff{0,1}|w(ebp|mv)|(j|m)pe{0,1}g4{0,1})$" \
	"id:210900,\
	phase:2,\
	pass,\
	nolog,\
	t:none, t:lowercase,\
	skipAfter:'SECMARKER_210900'"

SecRule REQUEST_URI "/imp/compose\.php" \
	"id:210910,\
	phase:2,\
	pass,\
	nolog,\
	t:none, t:lowercase,\
	skipAfter:'SECMARKER_210900'"

SecRule ARGS|REQUEST_URI|XML:/*|!ARGS:/body/|!ARGS:/description/|!ARGS:/solution/|!ARGS:/subject/|!ARGS:/txt/|!ARGS:message|!ARGS:resolution "(?:data|gopher|ogg|php|zlib|(?:f|ht)tps{0,1}):/" \
	"chain,\
	id:210920,\
	msg:'COMODO WAF: Malicious site name found in request',\
	phase:2,\
	severity:2,\
	capture,\
	deny,\
	status:403,\
	logdata:'%{TX.0}',\
	t:none, t:urlDecodeUni, t:replaceNulls, t:htmlEntityDecode, t:compressWhiteSpace, t:lowercase"
SecRule ARGS|REQUEST_URI|XML:/*|!ARGS:/body/|!ARGS:/description/|!ARGS:/subject/|!ARGS:/txt/|!ARGS:message|!ARGS:resolution "@pmFromFile bl_domains" \
	"t:none, t:urlDecodeUni, t:htmlEntityDecode, t:compressWhiteSpace"

SecRule ARGS|REQUEST_BODY|REQUEST_URI|XML:/*|!ARGS:/body/|!ARGS:/description/|!ARGS:/subject/|!ARGS:/txt/|!ARGS:resolution "(?:data|gopher|ogg|php|zlib|(?:f|ht)tps{0,1}):/" \
	"chain,\
	id:210930,\
	msg:'COMODO WAF: Malicious site name found in body',\
	phase:2,\
	severity:2,\
	capture,\
	deny,\
	status:403,\
	logdata:'%{TX.0}',\
	t:none, t:base64Decode, t:urlDecodeUni, t:replaceNulls, t:compressWhiteSpace, t:lowercase"
SecRule ARGS|REQUEST_BODY|REQUEST_URI|!ARGS:/body/|!ARGS:/description/|!ARGS:/subject/|!ARGS:/txt/ "@pmFromFile bl_domains" \
	"t:none, t:base64Decode, t:urlDecodeUni, t:replaceNulls, t:compressWhiteSpace"

SecMarker SECMARKER_210900



